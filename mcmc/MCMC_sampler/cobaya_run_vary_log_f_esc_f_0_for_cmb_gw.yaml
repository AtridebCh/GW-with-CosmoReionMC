#==============================================================
# Output
#==============================================================

output: chains_with_varying_log_f_esc_f_0/run_with_CMB_GW
resume: True
#force: False

#==============================================================
# Likelihood
#==============================================================

likelihood:

  cobayaLikelihood.ReionLikelihood:
    python_path: /dataserver/users/achatterjee/GW_with_CosmoReionMC/mcmc/MCMC_sampler
    include_planck: True
    include_gw: True
    include_21cm: False

    lyman_limit_datafile: '/Users/users/achatterjee/Data/GW_with_CosmoReionMC/ReionizationWithF2Py/ObsData/Lyman_limit.dat'
    gamma_datafile:       '/Users/users/achatterjee/Data/GW_with_CosmoReionMC/ReionizationWithF2Py/ObsData/gamma_data_all_combined.dat'
    T_b_Datafile:        '/Users/users/achatterjee/Data/GW_with_CosmoReionMC/global_21cm_signal/brightness_temp.txt'

#==============================================================
# Parameters
#==============================================================

params:

  hubble:
    prior:
      min: 65.0
      max: 80.0
    ref: 67.2
    proposal: 0.2

  ombh2:
    prior:
      min: 0.01
      max: 0.03
    ref: 0.0226   
    proposal: 0.0002

  omch2:
    prior:
      min: 0.09
      max: 0.20
    ref: 0.117
    proposal: 0.001

  As:
    prior:
      min: 1.8e-9
      max: 2.4e-9
    ref: 2.1e-9
    proposal: 5.0e-11

  ns:
    prior:
      min: 0.8
      max: 1.2
    ref: 0.96
    proposal: 0.003

  f_zero:
    prior:
      min: -4.0
      max: 0.0
    ref: -0.44
    proposal: 0.1

  alpha_lo:
    value: 0.0

  alpha_hi:
    value: 0.0

  alpha_z:
    value: 0.0

  log_esc_II:
    prior:
      min: -4.0
      max: 0.0
    ref: -1.45
    proposal: 0.1

  lambda0:
    prior:
      min: 1.0
      max: 12.0
    ref: 5.36
    proposal: 0.1

  Q_HII_at_z5p8:
    derived: True
  tau:
    derived: True



#==============================================================
# Sampler
#==============================================================

sampler:

  mcmc:

    max_samples: 500000

    burn_in: 0

    learn_proposal: True

    measure_speeds: False

    Rminus1_stop: 0.01

    Rminus1_cl_stop: 0.20

    output_every: 300s


